#!/usr/sbin/nft -f
# Inbound: only SSH (and ICMP). Outbound and forwarding are left open so docker
# manages its own rules. Edit and `systemctl reload nftables`.
table inet lite {}
flush table inet lite
table inet lite {
	chain input {
		type filter hook input priority 0; policy drop;
		ct state invalid drop
		ct state established,related accept
		iif lo accept
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept
		tcp dport 22 accept
		# mitmproxy explicit proxy for LAN devices (uncomment to expose)
		# tcp dport 8080 accept
	}
}
