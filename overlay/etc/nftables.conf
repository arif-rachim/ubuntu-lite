#!/usr/sbin/nft -f
# ubuntu-lite firewall. Inbound is closed except the services listed in
# /etc/nftables.d/ (rendered by `lite-fw`, do not hand-edit those files).
#  - block4   : manual blocklist            (lite-fw block/unblock)
#  - allow4   : allowlist, exempt from bans (lite-fw allow/unallow, lite-fw mode allowlist)
#  - scanners : auto-ban of hosts that probe closed TCP ports, expires by itself
# Outbound traffic is never filtered. Docker's own rules stay in its tables.
table inet lite {}
flush table inet lite
include "/etc/nftables.d/*.nft"
table inet lite {
	chain input {
		type filter hook input priority 0; policy drop;
		ct state invalid drop
		ct state established,related accept
		iif "lo" accept
		ip saddr @block4 counter drop
		ip saddr @scanners counter drop
		ip protocol icmp limit rate 20/second accept
		ip6 nexthdr icmpv6 accept
		jump services
		# everything else: remember TCP scanners (unless allowlisted), log a sample, drop
		tcp flags & (syn|ack) == syn ip saddr != @allow4 update @scanners { ip saddr } counter
		limit rate 30/minute burst 30 packets log prefix "lite-fw drop: " level info
		counter drop
	}
	chain forward {
		# published container ports arrive here (DNAT), not in input
		type filter hook forward priority -10; policy accept;
		ct state established,related accept
		iifname "docker0" accept
		iifname "br-*" accept
		ip saddr @block4 counter drop
		ip saddr @scanners counter drop
		jump forward_services
	}
}
