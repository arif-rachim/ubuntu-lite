name: build-iso
on:
  push:
    branches: ["**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            mmdebstrap squashfs-tools xorriso grub-efi-amd64-bin grub-pc-bin grub-common mtools dosfstools \
            gnupg curl jq apt-utils ubuntu-keyring openssl ovmf qemu-system-x86 qemu-utils
      - name: Build
        run: sudo -E build/build.sh
      - name: Boot test (QEMU, TCG)
        run: |
          sudo TIMEOUT=3000 scripts/test-qemu.sh install
          sudo TIMEOUT=1200 scripts/test-qemu.sh boot
      - name: Report
        run: |
          cat out/size-report.txt
          ls -lh out/*.iso
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-lite-iso
          path: |
            out/*.iso
            out/*.sha256
            out/size-report.txt
          retention-days: 7
          compression-level: 0
